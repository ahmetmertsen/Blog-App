name: buduns

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-BudunsDb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-BudunsDb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Onbellek olarak kullanildigi icin kalicilik kapali. Bellek dolarsa en az
    # kullanilan anahtarlar atilir; veri kaybi tolere edilebilir.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      target: migrator
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-BudunsDb};User ID=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};"
      Token__SecurityKey: ${TOKEN_SECURITY_KEY:?TOKEN_SECURITY_KEY zorunlu}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-BudunsDb};User ID=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};"
      ConnectionStrings__Redis: "redis:6379"
      Cache__DailyTopPostsTtlSeconds: ${CACHE_DAILY_TOP_POSTS_TTL_SECONDS:-60}
      Token__SecurityKey: ${TOKEN_SECURITY_KEY:?TOKEN_SECURITY_KEY zorunlu}
      VerificationCode__Secret: ${VERIFICATION_CODE_SECRET:?VERIFICATION_CODE_SECRET zorunlu}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      Mail__Username: ${MAIL_USERNAME:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Seq__ServerURL: ${SEQ_SERVER_URL:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
