name: buduns

x-app-config: &app-config
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-BudunsDb};User ID=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};"
  Seq__ServerURL: "http://seq:5341"
  Token__SecurityKey: "${TOKEN_SECURITY_KEY:?TOKEN_SECURITY_KEY tanimlanmali (bkz. .env.example)}"
  VerificationCode__Secret: "${VERIFICATION_CODE_SECRET:?VERIFICATION_CODE_SECRET tanimlanmali (bkz. .env.example)}"

services:
  postgres:
    image: postgres:16-alpine
    # jit=off: OLTP yukunde JIT derlemesi neredeyse hic karsiligini vermiyor.
    # daily-top50 olcumunde 1652 ms'nin 1437 ms'si JIT derlemesiydi; kapatinca
    # 324 ms'ye dustu. Yonetilen bir Postgres kullanilirsa ayni ayar sunucu
    # tarafinda ya da baglanti dizesine "Options=-c jit=off" eklenerek yapilir.
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-BudunsDb}
    # Host'ta 5432 genelde yerel bir Postgres tarafindan kullanildigi icin 55432.
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-BudunsDb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # Onbellek olarak kullanildigi icin kalicilik kapali. Bellek dolarsa en az
    # kullanilan anahtarlar atilir; veri kaybi tolere edilebilir.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    # Postgres ile ayni gerekce: host'ta 6379 genelde yerel bir Redis'in.
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seq:
    image: datalust/seq:2024.3
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - seq-data:/data

  migrator:
    build:
      context: ./buduns-server
      target: migrator
    environment:
      <<: *app-config
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./buduns-server
      target: runtime
    environment:
      <<: *app-config
      ASPNETCORE_ENVIRONMENT: Development
      # Redis yalnizca api'nin isine yarar; migrator onbellek kullanmiyor.
      # Tanimli olmazsa uygulama NullCacheService ile onbelleksiz calisir.
      ConnectionStrings__Redis: "redis:6379"
      Cache__DailyTopPostsTtlSeconds: ${CACHE_DAILY_TOP_POSTS_TTL_SECONDS:-60}
      Cache__EndpointPermissionTtlSeconds: ${CACHE_ENDPOINT_PERMISSION_TTL_SECONDS:-300}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5173}
      Mail__Username: ${MAIL_USERNAME:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
  seq-data:
