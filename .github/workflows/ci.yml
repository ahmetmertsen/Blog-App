name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Ayni dal icin arka arkaya gelen calistirmalarda eskisini iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  server:
    name: Server (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: buduns-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK surumu buduns-server/global.json'dan okunur; boylece CI ile
      # gelistirici makineleri ayni surumu kullanir.
      - name: .NET SDK kurulumu
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: buduns-server/global.json

      # Tum paket surumleri Directory.Packages.props icinde merkezi olarak
      # yonetildigi icin cache anahtari tek bir dosyaya baglanabiliyor.
      - name: NuGet paket cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('buduns-server/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore buduns-server.sln

      - name: Build (Release)
        run: dotnet build buduns-server.sln --configuration Release --no-restore

      - name: Unit testler
        run: >
          dotnet test Tests/buduns-server.UnitTests/buduns-server.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      # Integration testler Testcontainers ile gercek bir PostgreSQL ayaga
      # kaldirir; ubuntu-latest runner'inda Docker hazir gelir.
      # appsettings.Local.json depoda olmadigi icin baglanti bilgisi
      # tamamen test fixture'i tarafindan saglanir.
      - name: Integration testler
        run: >
          dotnet test Tests/buduns-server.IntegrationTests/buduns-server.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: buduns-server/TestResults/*.trx
          if-no-files-found: ignore

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: buduns-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: buduns-web/package-lock.json

      - name: Bagimliliklari kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
